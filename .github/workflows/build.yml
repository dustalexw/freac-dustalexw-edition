name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: ./Tests/core/run.sh
      - name: Build frickoss.app (Apple silicon + Intel)
        env:
          FREAC_NO_LAUNCH: "1"
        run: ./build.command universal
      - name: Zip the app
        run: |
          V="$(tr -d ' \n' < VERSION)"
          ditto -c -k --sequesterRsrc --keepParent build/frickoss.app "frickoss-$V-macOS-universal.zip"
          lipo -info build/frickoss.app/Contents/MacOS/Frickoss
          codesign --verify --deep --strict build/frickoss.app
      - uses: actions/upload-artifact@v4
        with:
          name: frickoss-macOS
          path: frickoss-*-macOS-universal.zip
          if-no-files-found: error
