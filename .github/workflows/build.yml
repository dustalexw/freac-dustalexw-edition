name: Build

# Builds frickoss.app on a real Mac for every push to main (or on demand),
# runs the core checks, and keeps the zipped app as a downloadable artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core checks
        run: ./Tests/core/run.sh
      - name: Build universal app (Apple silicon + Intel)
        env:
          FREAC_NO_LAUNCH: "1"
        run: ./build.command universal
      - name: Zip
        run: |
          V="$(tr -d ' \n' < VERSION)"
          ditto -c -k --sequesterRsrc --keepParent build/frickoss.app "frickoss-$V-macOS-universal.zip"
          lipo -archs build/frickoss.app/Contents/MacOS/Frickoss
          ls -l *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: frickoss-macOS
          path: frickoss-*-macOS-universal.zip
          retention-days: 30
